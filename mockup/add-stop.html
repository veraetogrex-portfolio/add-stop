<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T43 Add a Stop — flowers on the way to dinner</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the whole app screen from ../, in Nocturne type; no grid on the app screen */
  #stage{background:#07080C}
  #stage .vm{position:absolute;left:0;top:0;--font:var(--f-text)}
  body.autoplay #stage :focus-visible{outline:none}
  body.autoplay #li-cursor{transition:none}   /* visible from frame one, no fade at the loop seam */
  #li-cursor svg{transform:scale(1.5);transform-origin:4px 3px}   /* the hand stays readable in a phone-sized reel */
  #li-cursor.down svg{transform:scale(1.3)}
</style>
</head>
<body>
<div id="stage" data-title="T43 Add a Stop" data-url="veraetogrex-portfolio.github.io/add-stop">
  <section class="vm" aria-label="VECTOR Maps" data-assets="../assets/"></section>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const app = document.querySelector('.vm').mapsApp;
const at = sel => { const r = Stage.rect(document.querySelector(sel)); return [r.cx, r.cy]; };
const REST = [700, 800];
// one act: the route to dinner → Flowers: three florists and a dashed detour → Add stop: the line grows through stop 1, 19:38 → 19:44
Stage.init({
  reset: () => app.reset(),
  cursorStart: REST,
  async demo(s) {
    const t0 = performance.now();
    await s.until(t0, 1000);                          // the whole directions screen at rest first
    const [fx, fy] = at('[data-chip="flowers"]');
    await s.move([fx + 14, fy + 4], 550);             // Flowers in "Along your route"
    await s.until(t0, 1650);
    await s.click(null, { hold: 110 });               // three florists in the list and on the map, the detour +6 min draws itself
    await s.until(t0, 2550);
    const [ax, ay] = at('[data-add="petal"]');
    await s.move([ax + 30, ay + 8], 600);             // Add stop on Petal & Twine, right of the label
    await s.until(t0, 3250);
    await s.click(null, { hold: 120 });               // the line grows through stop 1 in 0.8 s, 22 → 28 min, 19:38 → 19:44
    await s.move([640, 560], 700, { arc: .2 });         // the hand moves onto the empty map below the river, out of the close-up on the result
    await s.until(t0, 7200);                          // the camera follows the line, holds a close-up of 28 min · arrive 19:44, then pulls back to the whole screen
  },
});
</script>
</body>
</html>
